name: Persistence store checks

on:
  push:
    paths: ['crates/atlas-store/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/atlas-store/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rust.yml']

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy -p atlas-store --all-targets --locked -- -D warnings
      - run: cargo +stable test -p atlas-store --locked
      - name: Measure persisted focused workloads (1k, 10k, 50k)
        run: |
          cargo +stable run -p atlas-store --example focused_world --locked --release -- 1000
          cargo +stable run -p atlas-store --example focused_world --locked --release -- 10000
          cargo +stable run -p atlas-store --example focused_world --locked --release -- 50000
