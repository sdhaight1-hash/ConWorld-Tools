name: Desktop platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Install the locked wasm-bindgen CLI
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              triple=x86_64-pc-windows-msvc
              temp="$(cygpath -u "$RUNNER_TEMP")"
              sha=844d23f1b56097549b936dd2e0d561fadebc1e8c9e985d5068b6b919654104ad
              ;;
            Linux)
              triple=x86_64-unknown-linux-musl
              temp="$RUNNER_TEMP"
              sha=9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
              ;;
          esac
          version=0.2.130
          asset="wasm-bindgen-$version-$triple"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version"
          cd "$temp"
          curl --fail --location --retry 3 "$url/$asset.tar.gz" --output "$asset.tar.gz"
          printf '%s  %s\n' "$sha" "$asset.tar.gz" | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_PATH, require("node:path").resolve(process.argv[1]) + "\n")' "$asset"
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --target wasm32-unknown-unknown -p atlas-renderer -- -D warnings
      - name: Install and build the webview frontend
        working-directory: apps/desktop
        run: npm ci && npm run build:renderer && npm run build
      - name: Verify the live Vite development server responds on the configured port
        working-directory: apps/desktop
        run: npm run smoke:dev
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --locked
      - name: Native Windows WebView2 smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./apps/desktop/scripts/windows-platform-smoke.ps1 -Binary ./target/debug/atlas-desktop.exe
          ./apps/desktop/scripts/windows-platform-smoke.ps1 -Binary ./target/debug/atlas-desktop.exe -RendererBenchmark
          ./apps/desktop/scripts/windows-platform-smoke.ps1 -Binary ./target/debug/atlas-desktop.exe -Ontology -CaptureDirectory ./Development-Screenshots
      - name: Upload native ontology capture
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-native-ontology
          path: Development-Screenshots/*_phase-03_semantic_native-ontology-evidence_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Browser fallback smoke tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          ATLAS_CAPTURE_PHASE3: "1"
        run: npx playwright install --with-deps chromium --only-shell && npm test
      - name: Upload Phase 3 browser development capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-browser-pagination
          path: Development-Screenshots/*_phase-03_query_mock-native-page-two_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 3 saved parameter browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-browser-saved-parameters
          path: Development-Screenshots/*_phase-03_query_saved-parameter-override_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 3 focused discovery browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-browser-focused-discovery
          path: Development-Screenshots/*_phase-03_discovery_focused-claim_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 3 published search browser captures
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-browser-published-search
          path: |
            Development-Screenshots/*_phase-03_query_mock-native-public-entry-find_01.png
            Development-Screenshots/*_phase-03_query_mock-native-public-world-search_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 private saved binding browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-saved-binding
          path: Development-Screenshots/*_phase-04_canvas_mock-native-saved-binding_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 reader backlinks browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-reader-links
          path: Development-Screenshots/*_phase-04_links_mock-native-reader-backlinks_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 source entry browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-source-entry
          path: Development-Screenshots/*_phase-04_canvas_mock-native-source-entry_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 panel browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-panel
          path: Development-Screenshots/*_phase-04_canvas_mock-native-panel_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 Canvas tree browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-tree
          path: Development-Screenshots/*_phase-04_canvas_mock-native-tree_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 template query browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-template-query
          path: Development-Screenshots/*_phase-04_canvas_mock-native-template-query_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload cross-phase institution and discovery browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-05-browser-institution-ghost
          path: Development-Screenshots/*_phase-05_network_mock-native-institution-ghost_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 custom template capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-custom-template
          path: Development-Screenshots/*_phase-04_canvas_mock-native-custom-template_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload Phase 4 image and hotspot browser capture
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-04-browser-image-hotspots
          path: Development-Screenshots/*_phase-04_canvas_mock-native-image-hotspots_01.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload semantic authoring browser captures
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase-03-semantic-annotation
          path: Development-Screenshots/*_phase-03_semantic_mock-native-annotation-*.png
          if-no-files-found: error
          retention-days: 30
