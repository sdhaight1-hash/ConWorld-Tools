name: Desktop platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Install the locked wasm-bindgen CLI
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              triple=x86_64-pc-windows-msvc
              temp="$(cygpath -u "$RUNNER_TEMP")"
              sha=844d23f1b56097549b936dd2e0d561fadebc1e8c9e985d5068b6b919654104ad
              ;;
            Linux)
              triple=x86_64-unknown-linux-musl
              temp="$RUNNER_TEMP"
              sha=9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
              ;;
          esac
          version=0.2.130
          asset="wasm-bindgen-$version-$triple"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version"
          cd "$temp"
          curl --fail --location --retry 3 "$url/$asset.tar.gz" --output "$asset.tar.gz"
          printf '%s  %s\n' "$sha" "$asset.tar.gz" | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_PATH, require("node:path").resolve(process.argv[1]) + "\n")' "$asset"
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --target wasm32-unknown-unknown -p atlas-renderer -- -D warnings
      - name: Install and build the webview frontend
        working-directory: apps/desktop
        run: npm ci && npm run build:renderer && npm run build
      - name: Check desktop launch configuration
        working-directory: apps/desktop
        run: npm run test:launch
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable test --workspace --locked
      # Smoke-test the same default-feature binary produced by ordinary cargo build.
      - run: cargo +stable build --workspace --locked
      - name: Native Windows WebView2 smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/windows-platform-smoke.ps1 -Binary ./target/debug/atlas-desktop.exe
      - name: Browser fallback smoke tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium --only-shell && npm test
