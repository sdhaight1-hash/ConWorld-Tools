name: Desktop platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - name: Install and build the webview frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - run: cargo +stable clippy --workspace --all-targets --locked --features custom-protocol -- -D warnings
      - run: cargo +stable test --workspace --locked --features custom-protocol
      - run: cargo +stable build --workspace --locked --features custom-protocol
      - name: Native Windows WebView2 smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/desktop/scripts/windows-platform-smoke.ps1 -Binary ./target/debug/atlas-desktop.exe
      - name: Browser fallback smoke tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium --only-shell && npm test
