name: Preserve verified Phase 3 capture
on:
  push:
    branches: ["work/phase-3-pagination-evidence"]
    paths: [".github/workflows/preserve-phase3-capture.yml"]
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore the exact inspected image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44935806242 --repo "$GITHUB_REPOSITORY" --name phase-03-browser-pagination --dir "$RUNNER_TEMP/capture"
          image='2026-11-21_18-34-46Z_phase-03_query_mock-native-page-two_01.png'
          printf '%s  %s\n' 'da1456f7e083180bc79d13c18ac4f419d13621c196c4eb6539bca7937d855ee3' "$RUNNER_TEMP/capture/$image" | sha256sum -c -
          test ! -e "Development-Screenshots/$image"
          cp "$RUNNER_TEMP/capture/$image" "Development-Screenshots/$image"
          printf '\n%s\n' '- 2026-11-21 18:34:46 UTC — [Pinned historical search, page 2](2026-11-21_18-34-46Z_phase-03_query_mock-native-page-two_01.png) — [Phase 3 #4](https://github.com/sdhaight1-hash/ConWorld-Tools/issues/4), [PR #37](https://github.com/sdhaight1-hash/ConWorld-Tools/pull/37), build [262d3a94](https://github.com/sdhaight1-hash/ConWorld-Tools/commit/262d3a94f663d23646af7ee0e8caac80b96ef10b), [CI run](https://github.com/sdhaight1-hash/ConWorld-Tools/actions/runs/44935806242). Actual Chromium Playwright capture with synthetic native IPC: author revision 7, page 2, distinct person identity and focused exploration/reference controls. Not a native Tauri/SQLite runtime capture.' >> Development-Screenshots/Dev-Screenshots.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Development-Screenshots/$image" Development-Screenshots/Dev-Screenshots.md
          git rm .github/workflows/preserve-phase3-capture.yml
          git commit -m "Preserve verified Phase 3 pagination screenshot"
          git push origin "HEAD:refs/heads/work/phase-3-pagination-evidence"
