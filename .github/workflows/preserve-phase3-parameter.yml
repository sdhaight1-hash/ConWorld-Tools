name: Preserve verified saved parameter capture
on:
  push:
    branches: ["work/phase-3-parameter-evidence"]
    paths: [".github/workflows/preserve-phase3-parameter.yml"]
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore exact inspected image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44938182599 --repo "$GITHUB_REPOSITORY" --name phase-03-browser-saved-parameters --dir "$RUNNER_TEMP/capture"
          image='2026-11-21_19-00-22Z_phase-03_query_saved-parameter-override_01.png'
          printf '%s  %s\n' '7651068a8f791a4062a7e721c62fe7ee35c04191916843c820049ce0b1fef2e7' "$RUNNER_TEMP/capture/$image" | sha256sum -c -
          test ! -e "Development-Screenshots/$image"
          cp "$RUNNER_TEMP/capture/$image" "Development-Screenshots/$image"
          printf '\n%s\n' '- 2026-11-21 19:00:22 UTC — [Saved query parameter override](2026-11-21_19-00-22Z_phase-03_query_saved-parameter-override_01.png) — [Phase 3 #4](https://github.com/sdhaight1-hash/ConWorld-Tools/issues/4), [PR #41](https://github.com/sdhaight1-hash/ConWorld-Tools/pull/41), build [3c844f6](https://github.com/sdhaight1-hash/ConWorld-Tools/commit/3c844f6ae1c62ff171bb9c02b57d2ec20474e8fb), [CI run](https://github.com/sdhaight1-hash/ConWorld-Tools/actions/runs/44938182599). Actual Chromium Playwright capture of the saved-query form with typed override Bob; synthetic native IPC, not native Tauri/SQLite runtime proof.' >> Development-Screenshots/Dev-Screenshots.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Development-Screenshots/$image" Development-Screenshots/Dev-Screenshots.md
          git rm .github/workflows/preserve-phase3-parameter.yml
          git commit -m "Archive verified saved-query parameter screenshot"
          git push origin "HEAD:refs/heads/work/phase-3-parameter-evidence"
