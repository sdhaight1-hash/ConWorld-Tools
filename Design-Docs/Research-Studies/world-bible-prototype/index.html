<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Bible — isolated UX prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#152229;color:#ebeee9;font:15px system-ui,sans-serif}header{padding:14px 24px;border-bottom:1px solid #3d5158;display:flex;gap:16px;align-items:center;background:#20333b}header strong{font-size:19px;color:#dec28c}header small{margin-left:auto;color:#b9c9c7}button,input,select,textarea{font:inherit;border:1px solid #526a70;border-radius:5px;padding:8px 10px;color:inherit;background:#263c44}button{cursor:pointer}button:hover,button[aria-pressed=true]{background:#42635b}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e3c084;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}main{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:calc(100vh - 57px)}aside{padding:18px;border-right:1px solid #3d5158;background:#1a2a31}aside input{width:100%}aside button{width:100%;text-align:left;margin:4px 0;border:0}section{padding:24px;max-width:1120px;width:100%;margin:auto}nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 20px}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#a5bbb6}h1{font:36px Georgia,serif;margin:8px 0}h2{font:23px Georgia,serif;margin:18px 0 10px}p{line-height:1.65}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,.panel{background:#23363d;border:1px solid #41565e;border-radius:8px;padding:16px}.card{text-align:left;min-height:86px}.card strong{display:block;color:#e5cc96}.card small,.muted{color:#afc2bf}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>label{flex:1;min-width:140px}label{display:grid;gap:5px;margin:8px 0}textarea{width:100%;min-height:120px;resize:vertical}input,select{max-width:100%}.article{background:#eee6d2;color:#41372b;padding:32px;border-radius:6px;margin-top:12px;min-height:360px}.article h1,.article h2{color:#3b3025}.article a,.article button{color:#273e36;background:transparent;border:1px solid #778b75}.article .muted{color:#615848}.article .facts{border:1px solid #b6a890;padding:16px;margin:14px 0}.items{display:grid;gap:8px}.item{display:flex;gap:12px;align-items:center;padding:10px;background:#2b4149;border-radius:5px}.item span{flex:1}.item button{padding:5px 8px}#status{min-height:24px;color:#d9c18c}dialog{color:inherit;background:#20333b;border:1px solid #526a70;border-radius:8px;width:min(420px,90vw)}@media(max-width:730px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #3d5158}section{padding:15px}header{padding:12px;flex-wrap:wrap}header small{margin:0}.article{padding:20px}}
</style>
<body>
<header><strong>◈ Living History Atlas</strong><span>Northbridge Chronicle</span><small>UX prototype · synthetic data · no persistence</small></header>
<main><aside><div class="eyebrow">World Bible</div><button id="home">⌂ Overview</button><label>Search entries<input id="search" placeholder="Search world…"></label><button id="new">＋ New entry</button><div id="directory" aria-label="World directory"></div></aside><section id="workspace"></section></main>
<dialog id="create"><form id="createForm"><h2>New entry</h2><label>Type<select id="newKind"><option>Person</option><option>Location</option><option>Organization</option><option>Family</option><option>Title</option><option>Asset</option><option>Concept</option></select></label><label>Name<input id="newName" required></label><div class="row"><button type="submit">Create identity only</button><button type="button" id="cancelCreate">Cancel</button></div></form></dialog>
<script>
"use strict";
const entries=[
{id:"mara",kind:"Person",name:"Mara Vale",sub:"Merchant · Aristocrat",text:"Mara Vale was a merchant and political figure in Northbridge.",article:true,released:true},
{id:"house",kind:"Family",name:"House Vale",sub:"Noble house",text:"The Vale dynasty.",article:true,released:true},
{id:"guild",kind:"Organization",name:"Merchants’ Guild",sub:"Guild",text:"A commercial institution.",article:true,released:true},
{id:"city",kind:"Location",name:"Northbridge",sub:"City · Port",text:"A coastal city.",article:true,released:true},
{id:"estate",kind:"Location",name:"Vale Estate",sub:"Estate",text:"",article:false,released:false},
{id:"crown",kind:"Title",name:"Lady of Blackthorn",sub:"Title",text:"",article:false,released:false},
{id:"secret",kind:"Organization",name:"Hidden Council",sub:"Private",text:"Unreleased fixture.",article:true,released:false}
];
let facts=[{id:1,from:"mara",to:"house",predicate:"Member of",since:"1862",private:false},{id:2,from:"mara",to:"city",predicate:"Resides in",since:"1862",private:false},{id:3,from:"estate",to:"city",predicate:"Within",since:"",private:false},{id:4,from:"mara",to:"secret",predicate:"Member of",since:"1889",private:true}];
const predicates={"Person:Family":["Member of"],"Person:Organization":["Member of"],"Person:Location":["Resides in","Born in"],"Person:Title":["Holds title"],"Person:Person":["Rival of"],"Person:Asset":["Owns"],"Location:Location":["Within"],"Organization:Organization":["Member of"],"Organization:Location":["Headquartered in"],"Family:Family":["Cadet branch of"]};
let active=null,mode="Read",reader=false,seq=10;
const $=id=>document.getElementById(id),byId=id=>entries.find(e=>e.id===id),el=(tag,value,cls)=>{const x=document.createElement(tag);if(value!==undefined)x.textContent=value;if(cls)x.className=cls;return x;};
const btn=(label,fn,cls)=>{const x=el("button",label,cls);x.type="button";x.addEventListener("click",fn);return x;};
function options(select,values){select.replaceChildren(...values.map(([id,label])=>{const o=el("option",label);o.value=id;return o;}));}
function allowed(e){return e&&(!reader||e.released);}
function directory(){const q=$("search").value.toLowerCase();$("directory").replaceChildren(...entries.filter(e=>allowed(e)&&(e.name+" "+e.kind).toLowerCase().includes(q)).map(e=>{const b=btn(e.name+" · "+e.kind,()=>open(e.id));b.setAttribute("aria-pressed",String(active===e.id));return b;}));}
function open(id){if(!allowed(byId(id)))return;active=id;mode="Read";render();}
function nav(root,labels){const n=el("nav");for(const label of labels){const b=btn(label,()=>{mode=label;render();});b.setAttribute("aria-pressed",String(mode===label));n.append(b);}root.append(n);}
function heading(root,e){root.append(el("div",e.kind+" · "+(e.released?"Released":e.article?"Draft":"Identity only"),"eyebrow"),el("h1",e.name),el("p",e.sub,"muted"));}
function link(id){const e=byId(id);return btn(e.name,()=>open(id));}
function related(e,publicOnly){return facts.filter(f=>(f.from===e.id||f.to===e.id)&&(!publicOnly||(!f.private&&byId(f.from).released&&byId(f.to).released)));}
function listFacts(root,e,publicOnly){const list=el("div",undefined,"items");for(const f of related(e,publicOnly)){const other=f.from===e.id?f.to:f.from;const row=el("div",undefined,"item");row.append(el("span",(f.from===e.id?f.predicate:"Incoming: "+f.predicate)+(f.private?" · Private":"")+(f.since?" · "+f.since:"")),link(other));list.append(row);}if(!list.children.length)list.append(el("p","No available connections."));root.append(list);}
function render(){directory();$("new").hidden=reader;const root=$("workspace");root.replaceChildren();const top=el("div",undefined,"row");top.append(el("span",reader?"Released reader preview":"Author workspace","eyebrow"),btn(reader?"Return to author":"Reader preview",()=>{reader=!reader;if(active&&!allowed(byId(active)))active=null;mode="Read";render();}));root.append(top);
if(!active){root.append(el("h1","World Bible"),el("p","Build and explore one interconnected historical world.","muted"));const cards=el("div",undefined,"cards");for(const e of entries.filter(allowed)){const b=btn("",()=>open(e.id),"card");b.append(el("strong",e.name),el("small",e.kind+" · "+(reader?"Article":e.released?"Released":e.article?"Draft":"Identity only")));cards.append(b);}root.append(cards);return;}
const e=byId(active);heading(root,e);if(!reader)nav(root,["Read","Edit","Connections","Hierarchy"]);
if(mode==="Read"){if(!e.article){root.append(el("p","This identity has no article."));if(!reader)root.append(btn("Compose article",()=>{mode="Edit";render();}));return;}const a=el("article",undefined,"article");a.append(el("h1",e.name),el("p",e.sub,"muted"),el("p",e.text||"No narrative recorded."),el("h2","Related entries"));const factsPanel=el("div",undefined,"facts");for(const f of related(e,reader)){const other=f.from===e.id?f.to:f.from;const line=el("p",(f.from===e.id?f.predicate:"Incoming: "+f.predicate)+" ");line.append(link(other));factsPanel.append(line);}a.append(factsPanel);root.append(a);}
if(mode==="Edit"){const p=el("div",undefined,"panel");const name=el("input");name.value=e.name;const text=el("textarea");text.value=e.text;const nameLabel=el("label","Canonical name");nameLabel.append(name);const textLabel=el("label","Article narrative");textLabel.append(text);p.append(el("h2","Identity and composition"),nameLabel,textLabel,btn("Save prototype article",()=>{if(!name.value.trim())return;e.name=name.value.trim();e.text=text.value;e.article=true;mode="Read";render();}));root.append(p,el("h2","Prepopulated relationships"));listFacts(root,e,false);root.append(btn("Edit connections",()=>{mode="Connections";render();}));}
if(mode==="Connections"){listFacts(root,e,false);const p=el("div",undefined,"panel");p.append(el("h2","Add compatible connection"));const filter=el("input");filter.id="targetSearch";filter.placeholder="Search compatible entries";const target=el("select");target.id="target";const pred=el("select");pred.id="predicate";const since=el("input");since.id="since";since.placeholder="Year or blank";const hidden=el("input");hidden.type="checkbox";const label=(s,c)=>{const l=el("label",s);l.append(c);return l;};const status=el("p","", "muted");status.id="status";const add=btn("Add connection",()=>{if(!target.value||!pred.value)return;if(facts.some(f=>f.from===e.id&&f.to===target.value&&f.predicate===pred.value)){status.textContent="Connection already recorded.";return;}facts.push({id:seq++,from:e.id,to:target.value,predicate:pred.value,since:since.value,private:hidden.checked});render();});
function updatePred(){const dst=byId(target.value);options(pred,(dst?predicates[e.kind+":"+dst.kind]||[]:[]).map(v=>[v,v]));add.disabled=!pred.value;status.textContent=dst&&pred.value?e.name+" → "+pred.value+" → "+dst.name:"No compatible target.";}
function updateTargets(){options(target,entries.filter(t=>t.id!==e.id&&predicates[e.kind+":"+t.kind]&&t.name.toLowerCase().includes(filter.value.toLowerCase())).map(t=>[t.id,t.name+" · "+t.kind]));updatePred();}
filter.addEventListener("input",updateTargets);target.addEventListener("change",updatePred);pred.addEventListener("change",()=>{status.textContent=e.name+" → "+pred.value+" → "+byId(target.value).name;});p.append(label("Find entry",filter),label("Target identity",target),label("Relationship type",pred),label("Effective from",since),label("Private fact",hidden),status,add);root.append(p);updateTargets();}
if(mode==="Hierarchy"){root.append(el("p","Separate relationship lenses. A shared identity can appear in several views; no copied records.","muted"));for(const [title,kinds] of [["Family",["Family"]],["Institution",["Organization"]],["Geography",["Location"]]]){const panel=el("div",undefined,"panel");panel.append(el("h2",title));const fs=related(e,false).filter(f=>kinds.includes(byId(f.from===e.id?f.to:f.from).kind));for(const f of fs){const other=f.from===e.id?f.to:f.from;const line=el("p",f.predicate+" ");line.append(link(other));panel.append(line);}if(!fs.length)panel.append(el("p","No recorded direct path."));root.append(panel);}}
}
$("search").addEventListener("input",directory);$("home").addEventListener("click",()=>{active=null;render();});$("new").addEventListener("click",()=>$("create").showModal());$("cancelCreate").addEventListener("click",()=>$("create").close());$("createForm").addEventListener("submit",ev=>{ev.preventDefault();const name=$("newName").value.trim();if(!name)return;const e={id:"new-"+seq++,kind:$("newKind").value,name,sub:"",text:"",article:false,released:false};entries.push(e);$("create").close();$("newName").value="";open(e.id);});render();
</script></body></html>
