<!doctype html><meta charset="utf-8"><title>Northbridge cartography research #66</title>
<style>body{margin:0;background:#f2eee3;color:#273c39;font:15px system-ui}header{padding:16px 24px;border-bottom:1px solid #b5b09d}h1{margin:0;font: bold 25px Georgia}button,select{font:inherit;margin:0 5px;padding:5px}main{padding:12px 24px}svg,canvas{background:#c9dfe0;border:1px solid #9aab9d;max-width:100%;height:auto}#legend{margin:8px 0}svg [data-id]{cursor:pointer}small{color:#536a62}</style>
<header><h1>Northbridge · Historical atlas</h1><small>Research #66 · isolated vector prototype · synthetic data</small></header><main><label>Map <select id="mode"><option>regional</option><option>candidate</option><option>town</option><option>manor</option><option>ship</option><option>schematic</option></select></label><label>Day <select id="day"><option>99</option><option>100</option></select></label><label>Branch <select id="branch"><option>main</option><option>fork</option></select></label><label><input id="author" type="checkbox">Author</label><button id="back">Region</button><div id="legend"></div><div id="map"></div><p id="detail">Select a feature to explore.</p></main>
<script>
const W=640,H=360,ns='http://www.w3.org/2000/svg';
const pal={land:'#e5dfbd',A:'#d6b989',B:'#a9c9a5',water:'#8bbbc7',road:'#8e7858',building:'#d1ad83',wall:'#405a53',draft:'#d7c2e5',forest:'#718f68'};
const box=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const P=(id,rings,fill,extra={})=>({id,kind:'polygon',rings,fill,...extra});
const L=(id,points,stroke)=>({id,kind:'line',points,stroke});
const T=(id,x,y,label,extra={})=>({id,kind:'point',x,y,label,...extra});
const land=[[25,35],[590,35],[615,290],[475,332],[45,305]];
const edge=[[320,35],[300,115],[335,205],[315,315]];
const region=(day,branch,author,secret=true)=>{let changed=day>=100&&branch==='main';return [P('land',[land],pal.land),P('west',[[[25,35],...edge,[45,305]],box(105,150,40,31)],pal.A),P('east',[[...edge,[475,332],[615,290],[590,35]]],changed?pal.B:pal.A),L('river',[[270,35],[260,95],[280,155],[245,215],[258,318]],pal.water),L('road',[[75,220],[180,170],[380,130],[540,230]],pal.road),T('town',180,170,'Northbridge',{target:'town'}),T('port',540,230,'Eastport'),T('oldfort',380,130,'Old Fort'),...(author&&secret?[T('hidden',195,170,'Hidden vault')]:[])];};
// Clip a convex region to distance halfplanes, unweighted Voronoi. Anchors remain fixed.
function clip(poly,a,b){let s=p=>2*(b[0]-a[0])*p[0]+2*(b[1]-a[1])*p[1]+a[0]**2+a[1]**2-b[0]**2-b[1]**2;let out=[];for(let i=0;i<poly.length;i++){let p=poly[i],q=poly[(i+1)%poly.length],u=s(p),v=s(q);if(u<=1e-8)out.push(p);if((u<0&&v>0)||(u>0&&v<0)){let f=u/(u-v);out.push([p[0]+f*(q[0]-p[0]),p[1]+f*(q[1]-p[1])]);}}return out;}
function cells(anchors){if(new Set(anchors.map(a=>a.join(','))).size!==anchors.length)throw Error('duplicate anchors');return anchors.map((a,i)=>anchors.reduce((p,b,j)=>i===j?p:clip(p,a,b),box(35,35,570,290)));}
function candidate(seed=66){let rand=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;let anchors=[[180,170],[410,110],[470,260],[90+rand()*60,75+rand()*45]];return [...cells(anchors).map((p,i)=>P('draft-'+i,[p],pal.draft,{draft:true})),...anchors.map((p,i)=>T('anchor-'+i,...p,i===0?'Locked town':i===3?'Proposed site':'Known anchor'))];}
function scene(mode,day,branch,author){if(mode==='regional')return region(day,branch,author);if(mode==='candidate')return candidate();if(mode==='town')return [P('town-ground',[box(25,25,590,310)],pal.land),L('main-street',[[30,180],[610,180]],pal.road),...Array.from({length:12},(_,i)=>P('parcel-'+i,[box(45+i%6*94,55+Math.floor(i/6)*165,72,68)],pal.building)),T('manor',81,89,'Manor',{target:'manor'}),T('market',365,180,'Market')];if(mode==='manor')return [P('floor',[box(85,45,470,270)],pal.land),...Array.from({length:6},(_,i)=>P('room-'+i,[box(95+i%3*150,55+Math.floor(i/3)*130,140,110)],pal.building)),T('study',165,100,'Study'),T('hall',315,230,'Hall')];if(mode==='ship')return [P('deck',[[[45,180],[130,80],[530,80],[600,180],[530,280],[130,280]]],pal.land),P('cabin',[box(170,100,130,80)],pal.building),T('cabin-label',185,140,'Cabin'),T('position',410,220,day>=100?'At Eastport':'At Northbridge')];return [P('scope',[box(40,35,560,290)],pal.land),P('nested',[box(100,90,440,200)],pal.B),P('inner',[box(175,155,290,90)],pal.building),T('region-label',60,55,'Valley'),T('town-label',120,110,'Town'),T('estate-label',195,180,'Estate')];}
const path=rings=>rings.map(r=>'M'+r.map(p=>p.map(x=>x.toFixed(3)).join(',')).join('L')+'Z').join('');
const labels=fs=>{let occupied=[];return fs.filter(f=>f.kind==='point').map(f=>{let w=f.label.length*7+6,h=16;let choices=[[8,-8],[8,12],[-w-8,-8],[-w-8,12]];let at=choices.map(([dx,dy])=>[f.x+dx,f.y+dy-h,w,h]).find(([x,y,w,h])=>x>=0&&y>=0&&x+w<=W&&y+h<=H&&!occupied.some(([a,b,c,d])=>x<a+c&&x+w>a&&y<b+d&&y+h>b));if(at)occupied.push(at);return {f,at};});};
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[x]));
function svg(fs){return `<svg xmlns="${ns}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+fs.map(f=>f.kind==='polygon'?`<path data-id="${esc(f.id)}" d="${path(f.rings)}" fill="${f.fill}" fill-rule="evenodd" stroke="#405a53" stroke-width="1" ${f.draft?'stroke-dasharray="5 3"':''}/>`:f.kind==='line'?`<polyline data-id="${esc(f.id)}" points="${f.points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${f.stroke}" stroke-width="3"/>`:`<circle data-id="${esc(f.id)}" cx="${f.x}" cy="${f.y}" r="4" fill="#273c39" stroke="white"/>`).join('')+labels(fs).filter(x=>x.at).map(({f,at})=>`<text x="${at[0]}" y="${at[1]+12}" font-family="sans-serif" font-size="12" fill="#273c39" paint-order="stroke" stroke="#f2eee3" stroke-width="3">${esc(f.label)}</text>`).join('')+'</svg>';}
function canvas(fs,ctx){ctx.clearRect(0,0,W,H);for(let f of fs){ctx.beginPath();if(f.kind==='polygon'){for(let r of f.rings){r.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();}ctx.fillStyle=f.fill;ctx.fill('evenodd');ctx.strokeStyle='#405a53';ctx.lineWidth=1;ctx.setLineDash(f.draft?[5,3]:[]);}else if(f.kind==='line'){f.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=f.stroke;ctx.lineWidth=3;ctx.setLineDash([]);}else{ctx.arc(f.x,f.y,4,0,Math.PI*2);ctx.fillStyle='#273c39';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=1;ctx.setLineDash([]);}ctx.stroke();}ctx.font='12px sans-serif';ctx.fillStyle='#273c39';for(let {f,at} of labels(fs))if(at)ctx.fillText(f.label,at[0],at[1]+12);}
function render(){let fs=scene(mode.value,+day.value,branch.value,author.checked);map.innerHTML=svg(fs);legend.textContent=mode.value==='candidate'?'DRAFT · generated approximate cells, not canon':mode.value==='schematic'?'SCHEMATIC · nesting only, not to scale':'AUTHORED FIXTURE · local frame · '+branch.value+' · day '+day.value;map.onclick=e=>{let f=fs.find(f=>f.id===e.target.dataset.id);if(f){detail.textContent=f.id;if(f.target){mode.value=f.target;render();}}};}for(let el of [mode,day,branch,author])el.onchange=render;back.onclick=()=>{mode.value='regional';render();};render();
window.lab={region,candidate,cells,scene,svg,canvas,labels,P,box};
</script>
