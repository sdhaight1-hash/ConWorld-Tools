<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living History Atlas</title>
  </head>
  <body>
    <header>
      <p>Living History Atlas</p>
      <p id="host" role="status">Loading local scene…</p>
    </header>
    <main>
      <h1>Northbridge</h1>
      <p class="intro">Explore the people, places, and events in the platform fixture.</p>
      <a id="benchmark-link" href="?benchmark=1">Open renderer benchmark</a>
      <section id="workspace" aria-label="Northbridge scene" hidden>
        <div class="graph">
          <div class="toolbar">
            <h2>Connections</h2>
            <div role="group" aria-label="Graph zoom">
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="reset-zoom" type="button" aria-label="Reset zoom">100%</button>
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            </div>
          </div>
          <div id="plot" tabindex="0" role="region" aria-label="Scrollable diagram">
            <div id="graph-layers"><canvas id="graph" aria-hidden="true"></canvas></div>
          </div>
          <p id="renderer" class="status" role="status">Checking WebGPU…</p>
          <div id="gpu-controls" class="toolbar" hidden>
            <button type="button" id="retry-gpu" disabled>Retry WebGPU</button>
            <button type="button" id="lose-gpu" disabled>Simulate device loss</button>
          </div>
        </div>
        <aside class="inspector" aria-label="Node inspector">
          <h2>Nodes</h2>
          <ul id="nodes"></ul>
          <div class="details" aria-live="polite">
            <h3 id="selection"></h3>
            <ul id="connections"></ul>
          </div>
        </aside>
      </section>
      <section id="history" class="history" aria-label="Northbridge relationship history" hidden>
        <div class="toolbar">
          <div>
            <h2>Relationship evolution</h2>
            <p class="hint">Rust/SQLite-backed Northbridge demonstration, not yet an editing interface.</p>
          </div>
          <label for="history-year">Historical snapshot
            <select id="history-year">
              <option value="0">1898 · Friendship</option>
              <option value="3652">1908 · Letter disclosed</option>
              <option value="5844">1914 · Uneasy alliance</option>
            </select>
          </label>
        </div>
        <div id="history-relations" class="history-grid" aria-live="polite"></div>
        <div id="history-cause" class="history-cause" role="status"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
