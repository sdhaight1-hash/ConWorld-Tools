[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[features]
# Standalone Cargo builds load bundled assets. The Tauri dev CLI disables default
# features and starts Vite through beforeDevCommand for live reload.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
