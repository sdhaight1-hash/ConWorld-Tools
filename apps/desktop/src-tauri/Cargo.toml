[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

# Standalone Cargo builds load embedded assets; `tauri dev` uses Vite.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
